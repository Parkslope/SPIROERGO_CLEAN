# Multi-Plot CPET Data Configuration for ConvNeXt
# For conference submission - uses provided sample data
csv_file: "sample_data/sample_labels.csv"
plot_dir: "sample_data"

# Image processing
image_size: 224  # Match ConvNeXt pretrained size (224x224)
num_plots: 9  # 3x3 grid

# Data loading
batch_size: 8  # Smaller batch size due to 9 plots per sample
num_workers: 4
pin_memory: true
drop_last: true  # For training only

# Data splits (defined in CSV)
splits:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

# Class information
classes:
  - "Normal"
  - "Pulmonary Hypertension"
  
class_weights: "auto"  # auto, balanced, or specific weights [w0, w1]

# Data validation
check_files: true
validate_splits: true
