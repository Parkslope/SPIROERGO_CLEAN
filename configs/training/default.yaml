# Training Configuration
epochs: 100
learning_rate: 3e-4  # Increased from 1e-4 for better optimization (ConvNeXt/Swin need higher LR)
weight_decay: 1e-4

# Optimizer settings
optimizer:
  name: "adamw"
  betas: [0.9, 0.999]
  eps: 1e-8
  
# Learning rate scheduling
scheduler:
  name: "reduce_on_plateau"  # reduce_on_plateau, cosine_annealing, step_lr
  factor: 0.5
  patience: 5
  min_lr: 1e-7
  verbose: true

# Differential learning rates for different model components
learning_rates:
  cnn_backbone: 0.3  # Increased from 0.1 - ConvNeXt/Swin need higher LR than ResNet
  vit_components: 1.0  # Multiplier for ViT and patch embedding
  classifier: 2.0     # Multiplier for classification head

# Early stopping
early_stopping:
  patience: 15
  min_delta: 0.001
  monitor: "val_auc"
  mode: "max"
  restore_best_weights: true

# Model checkpointing
checkpoint:
  monitor: "val_auc"
  mode: "max"
  save_best_only: true
  save_last: true
  
# Loss function
loss:
  name: "cross_entropy"
  label_smoothing: 0.1
  use_class_weights: true

# Regularization
regularization:
  gradient_clipping: 1.0
  dropout_rate: 0.2

# Mixed precision training
mixed_precision: true

# Validation frequency
val_check_interval: 1  # Validate every N epochs
