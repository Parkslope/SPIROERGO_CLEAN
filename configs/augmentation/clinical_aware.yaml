# Clinically-Aware Data Augmentation Configuration
# Designed to preserve physiological meaning of CPET plots

# Training augmentations
train_augmentations:
  # Geometric transformations (minimal to preserve curve relationships)
  geometric:
    shift_scale_rotate:
      enabled: true
      shift_limit: 0.05    # Minimal shift to preserve alignment
      scale_limit: 0.05    # Minimal scale to preserve proportions  
      rotate_limit: 2      # Very small rotation to avoid distorting curves
      border_mode: "constant"
      value: 255
      probability: 0.3

  # Color and brightness adjustments (realistic variations)
  photometric:
    brightness_contrast:
      enabled: true
      brightness_limit: 0.1
      contrast_limit: 0.1
      probability: 0.5
      
    gamma_correction:
      enabled: true
      gamma_limit: [90, 110]
      probability: 0.3

  # Noise and blur (realistic scanner/acquisition variations)
  noise_blur:
    gaussian_blur:
      enabled: true
      blur_limit: [1, 3]
      probability: 0.3
      
    median_blur:
      enabled: true
      blur_limit: 3
      probability: 0.2
      
    gaussian_noise:
      enabled: true
      var_limit: [10, 30]
      probability: 0.3

  # PROHIBITED augmentations for medical plots:
  prohibited:
    - "horizontal_flip"     # Alters physiological meaning
    - "vertical_flip"       # Destroys curve relationships
    - "strong_rotation"     # Distorts medical curves
    - "elastic_transform"   # Changes curve shapes
    - "cutout"             # May remove critical diagnostic features
    - "mixup"              # Mixes different patients

# Validation/Test augmentations (normalization only)
val_test_augmentations:
  normalize_only: true

# Normalization parameters
normalization:
  mean: [0.485, 0.456, 0.406]  # ImageNet statistics
  std: [0.229, 0.224, 0.225]
  max_pixel_value: 255.0

# Medical imaging specific considerations
medical_constraints:
  preserve_aspect_ratio: true
  maintain_curve_continuity: true
  avoid_diagnostic_region_occlusion: true
  
clinical_notes: |
  These augmentation parameters are specifically designed for CPET plots:
  1. Minimal geometric transforms to preserve V̇E/V̇CO₂ slope relationships
  2. Realistic photometric variations mimicking different display conditions
  3. Subtle noise/blur representing acquisition variations
  4. NO flips or strong rotations that would alter physiological interpretation
